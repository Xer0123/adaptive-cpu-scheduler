[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-cpu-scheduler"
version = "0.1.0"
description = "Reproducible simulation framework for classical and PPO CPU schedulers"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "gymnasium>=0.29", "stable-baselines3>=2.3"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
cpu-scheduler = "adaptive_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
